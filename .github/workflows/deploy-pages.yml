# Publica develop en GitHub Pages (https://flopez-dev.github.io/ikaika-salud/) como entorno
# de pruebas para enseñar al cliente. No es producción y no se tiene que indexar:
# NOINDEX_SITE pone `noindex, nofollow` en cada página y `Disallow: /` en robots.txt (ver
# Base.astro y robots.txt.ts). El robots.txt bajo /ikaika-salud/ no lo lee ningún buscador
# (solo cuenta el de la raíz del dominio), así que lo que protege es la meta.
name: Deploy develop to GitHub Pages

# Solo tras un CI en verde sobre develop: así nunca se publica un build que no pasa los tests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run también salta con el CI de un PR cuya rama se llame develop (p. ej. desde un
    # fork): se exige que sea el CI de un push, además de que haya pasado. A mano, solo desde
    # develop. Ojo: con workflow_run el job corre en el contexto de main (la rama por defecto),
    # así que el entorno github-pages admite main y develop; lo que se publica es head_sha.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # El commit exacto que pasó el CI, no el último de develop.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Canonical y Open Graph apuntan a la propia copia de Pages: un canonical al dominio
      # real junto a un noindex serían señales contradictorias.
      - run: npm run build
        env:
          SITE_URL: https://flopez-dev.github.io
          BASE_PATH: /ikaika-salud/
          NOINDEX_SITE: 'true'

      # El despliegue por artefacto no pasa por Jekyll, pero si algún día lo hiciera se
      # comería _astro/.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
